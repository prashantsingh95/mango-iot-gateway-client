# Mango IoT Gateway Agent Configuration
# All fields documented with defaults.
# Path: /opt/gateway/config.yml or set GATEWAY_CONFIG env var.
# Environment: production (default, fail-closed) | development | test
#   GATEWAY_ENV env var wins over this file. Never allow anonymous MQTT in production.
environment: production

gateway:
  device_id: ""                    # Auto from MAC if empty
  name: "Raspberry Pi Gateway"
  serial_number: ""                # Auto from /proc/cpuinfo if empty
  tenant_id: "default"
  provision_token: ""              # Set for auto-registration
  platform_url: ""                 # e.g. https://platform.example.com
  offline_path: ""                 # Override offline storage base path (default /data/offline on Linux, config dir otherwise)

# White-label / OEM identity (SaaS white-label). Same binary, tenant-driven
# branding delivered via provisioning. Never change tenant binding locally —
# tenant assignment is authorized by the platform only.
branding:
  product_name: "Mango Gateway"
  manufacturer: "Mango IoT"
  support_url: ""
  support_email: ""
  device_label: ""
  device_model: ""

# Persistent offline spool (Phase 5). Telemetry/status/logs survive MQTT and
# internet outages in a bounded SQLite queue, then upload in order.
# Set max_events: 0 to disable (outage events are dropped, legacy behavior).
queue:
  path: ""              # default <config-dir>/spool.db
  max_events: 20000     # row cap; oldest low-priority rows evict first
  ttl_hours: 72         # event age cap
  max_mb: 256           # payload byte cap
  flush_batch: 100      # events per reconnect flush cycle

mqtt:
  broker_url: "mqtt://localhost:1883"
  username: ""                     # Per-gateway MQTT username (required in production, provisioned via provisioning.go)
  password: ""                     # Per-gateway MQTT password (required in production, encrypted at rest 0600 via secrets.go)
  allow_anonymous: false           # ONLY true for explicit development Mosquitto (allow_anonymous true). Production NEVER allows true.
  client_id_prefix: "gw"
  ssl: false
  ca_cert: ""                      # Path to CA cert for TLS
  client_cert: ""                  # Path to client cert for TLS
  client_key: ""                   # Path to client key for TLS
  qos: 1
  keep_alive: 60
  clean_session: false             # MUST be false for persistent QoS1 session (enforced by ValidateMQTTConfig)
  reconnect_delay: 5
  max_reconnect_delay: 60
  topics:
    telemetry: "gateway/{device_id}/telemetry"
    status: "gateway/{device_id}/status"
    log: "gateway/{device_id}/log"
    command: "gateway/{device_id}/command/set"
    response: "gateway/{device_id}/command/response"

modbus:
  enabled: false
  devices:
    # - name: "power-meter"
    #   protocol: "tcp"            # tcp or rtu
    #   address: "192.168.1.100:502"
    #   slave_id: 1
    #   baud_rate: 9600            # RTU only
    #   data_bits: 8               # RTU only
    #   stop_bits: 1               # RTU only
    #   parity: "N"                # RTU only: N, E, O
    #   interval: 10               # Poll interval in seconds
    #   registers:
    #     - name: "voltage"
    #       address: 0
    #       quantity: 2
    #       type: "float32"        # float32, int16, uint16, uint32, int32, bool, holding
    #     - name: "current"
    #       address: 2
    #       quantity: 2
    #       type: "float32"

gpio:
  enabled: false
  sensors:
    # - name: "relay-1"
    #   pin: 17
    #   mode: "output"             # input or output
    #   pull: "down"               # input only: up, down, none
    #   interval: 5
    #   default: false

monitoring:
  interval: 30                     # Seconds between telemetry publish
  cpu: true
  memory: true
  disk: true
  temperature: true
  network: true
  disk_threshold_warn: 90          # Percent
  memory_threshold_warn: 90
  cpu_threshold_warn: 90
  temp_threshold_warn: 80          # Celsius

logging:
  level: "info"                    # debug, info, warn, error
  file: "/var/log/gateway-agent.log"
  max_size: 10                     # MB before rotation
  max_backups: 7
  remote: true                     # Send logs to cloud via MQTT

ota:
  enabled: true
  firmware_dir: "/opt/gateway/firmware"
  backup_dir: "/opt/gateway/backup"
  auto_rollback: true
  rollback_timeout: 30             # Seconds to wait before rollback
  signing_key: ""                  # Hex ed25519 pubkey; when set, artifacts MUST carry a valid signature

watchdog:
  enabled: true
  interval: 60                     # Seconds between health checks
  max_missed_pings: 3
  action: "restart"                # restart, reboot, or custom command

commands:
  enabled: true
  allowed:
    - "reboot"
    - "restart_agent"
    - "run_shell"
    - "update_firmware"
    - "set_relay"
    - "read_register"
    - "wifi_ap.status"
    - "wifi_ap.enable"
    - "wifi_ap.disable"
    - "wifi_ap.configure"
    - "mqtt.local.status"
    - "mqtt.local.enable"
    - "mqtt.local.disable"
    - "mqtt.local.restart"
    - "mqtt.local.config"
    - "mqtt.local.logs"
    - "mqtt.local.clients"
    - "mqtt.local.meters"
    - "mqtt.local.test"
    - "wifi_ap.clients"
    - "wifi_ap.ping_client"
  shell:
    allowed_paths:
      - "/opt/gateway/scripts/"
      - "/usr/local/bin/"
    timeout: 30                    # Seconds before shell command timeout

# Remote Wi-Fi AP management. The client detects NetworkManager (nmcli) first,
# then hostapd. Configure the connection/interface explicitly on production
# gateways so commands cannot target an unintended wireless device.
wifi_ap:
  enabled: true
  interface: "wlan0"
  connection: "mango-ap"
  hostapd_config: ""
  max_clients: 64

# Cloudflare Zero Trust Tunnel (Phase 4). When enabled, the agent opens an OUTBOUND
# TLS WebSocket to the backend /agent namespace (no inbound ports). Obtain
# agent_secret from the platform: POST /gateways/:id/agent-secret (Admin).
# This is the Cloudflare Zero Trust Tunnel for secure SSH access.
cloudflare_tunnel:
  enabled: false
  gateway_id: ""                   # Defaults to gateway.device_id
  backend_ws_url: "ws://localhost:3001"   # wss://... in production
  agent_secret: ""                 # One-time secret issued by the platform
  signing_pepper: ""               # MUST match backend TERMINAL_SIGNING_PEPPER
  heartbeat_ms: 30000
  reconnect_base_ms: 1000
  reconnect_max_ms: 30000
  shell: "/bin/bash"
  shell_allowlist:                 # Only these shells may ever spawn (backend suggestions outside this list are ignored)
    - "/bin/bash"
  file_dir: "/tmp"                 # Jail for uploads AND downloads (absolute escapes rejected)
  max_file_bytes: 26214400         # Per-transfer cap (25MB)
  idle_timeout_minutes: 30         # Idle PTY sessions are reaped
  max_session_hours: 8             # Absolute session lifetime
  max_sessions: 5                  # Concurrent PTY cap
  insecure_skip_verify: false      # TEST ONLY. Never true in production.

# Local MQTT broker for customer meters over gateway Wi-Fi/LAN (Mosquitto).
# Independent from the remote HiveMQ client above. Disabled by default —
# enable from the platform (Devices > Local MQTT) or the agent API.
local_broker:
  enabled: false
  mode: "secure"                   # unsecured|secure|both
  bind: "0.0.0.0"                  # meter-facing listen address (all LAN/Wi-Fi)
  port_unsecured: 1883
  port_secure: 8883
  allow_anonymous_unsecured: false
  users: []                        # [{username, password}] — passwords enc: at rest
  max_connections: 100
  max_payload_bytes: 65536

# Local meter client: ingests meter/# from 127.0.0.1, validates, queues locally.
local_client:
  enabled: true                    # runs whenever the local broker is enabled
  username: "gateway-local"
  password: ""                     # auto-provisioned on first enable
  topics:
    - "meter/#"
  max_payload_bytes: 65536
